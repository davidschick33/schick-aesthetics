<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Bewertungskarte – Dr. Schick Medical Aesthetics</title>
<!-- Visitenkartenformat 85 × 55 mm, Vorder- und Rückseite. ?beschnitt=1 ergänzt 3 mm Beschnitt.
     Erzeugen: node bewertungskarte/make_karte.js -->
<style>
@font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 500; src: url("../src/assets/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); }
@font-face { font-family: "Cormorant Garamond"; font-weight: 600; src: url("../src/assets/fonts/cormorant-garamond-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Jost"; font-weight: 300; src: url("../src/assets/fonts/jost-latin-300-normal.woff2") format("woff2"); }
@font-face { font-family: "Jost"; font-weight: 500; src: url("../src/assets/fonts/jost-latin-500-normal.woff2") format("woff2"); }
:root { --bleed: 0mm; --gold: #82633d; --gold-d: #5e3f1a; --soft: #545b5f; }
.bleed { --bleed: 3mm; }
@page { margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-family: "Jost", sans-serif; font-weight: 300; color: #26292b; }
.page { position: relative; overflow: hidden; width: calc(85mm + 2 * var(--bleed)); height: calc(55mm + 2 * var(--bleed));
  background: linear-gradient(160deg, #f8f7f4 0%, #edf2f3 55%, #e4ecee 100%); page-break-after: always; break-after: page; }
.page:last-child { page-break-after: auto; break-after: auto; }
.drops { position: absolute; inset: 0; background: url("../src/assets/img/drops.webp") 0 0 / 60mm repeat; opacity: .45; }
.drops-big { position: absolute; inset: 0; background: url("../src/assets/img/drops-hero.webp") right -34mm center / auto 70mm no-repeat; opacity: .55; }
.safe { position: absolute; inset: calc(var(--bleed) + 4mm); display: flex; flex-direction: column; }
/* Vorderseite */
.front .safe { align-items: center; justify-content: center; text-align: center; }
.front .logo { width: 44mm; display: block; }
.front h1 { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; font-size: 6mm; line-height: 1.1; color: #6e4f26; margin-top: 3.2mm; }
.front p { font-size: 2.3mm; letter-spacing: .16em; text-transform: uppercase; color: var(--soft); margin-top: 1.4mm; }
.stars { color: #b39466; font-size: 3.6mm; letter-spacing: 1.2mm; margin-top: 1.6mm; }
/* Rückseite */
.back .safe { flex-direction: row; align-items: center; gap: 4.5mm; }
.qr { flex: none; width: 27mm; height: 27mm; background: #fff; border-radius: 2mm; padding: 1.6mm; box-shadow: 0 1mm 3mm -1.5mm rgba(31,60,70,.4); }
.qr img { width: 100%; height: 100%; display: block; }
.txt h2 { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 4.4mm; line-height: 1.15; color: var(--gold-d); }
.txt ol { list-style: none; margin-top: 2mm; }
.txt li { font-size: 2.35mm; line-height: 1.5; color: var(--soft); }
.txt li b { font-weight: 500; color: var(--gold); margin-right: 1mm; }
.txt .thanks { margin-top: 2mm; font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 3.4mm; color: #6e4f26; }
.txt .name { font-size: 1.9mm; letter-spacing: .14em; text-transform: uppercase; color: var(--soft); margin-top: .4mm; }
</style>
</head>
<body>
<section class="page front">
  <div class="drops"></div><div class="drops-big"></div>
  <div class="safe">
    <img class="logo" src="../src/assets/img/logo-dr-schick.svg" alt="Dr. Schick">
    <h1>Wie war Ihr Besuch?</h1>
    <div class="stars">★★★★★</div>
    <p>Ihre Meinung ist mir wichtig</p>
  </div>
</section>
<section class="page back">
  <div class="drops"></div>
  <div class="safe">
    <div class="qr"><img src="qr-bewertung.svg" alt="QR-Code zur Google-Bewertung"></div>
    <div class="txt">
      <h2>Bewerten Sie uns auf Google</h2>
      <ol>
        <li><b>1</b>QR-Code mit dem Handy scannen</li>
        <li><b>2</b>Sterne vergeben</li>
        <li><b>3</b>gern ein paar Worte schreiben</li>
      </ol>
      <p class="thanks">Herzlichen Dank!</p>
      <p class="name">Dr. Karina Schick</p>
    </div>
  </div>
</section>
<script>if (new URLSearchParams(location.search).get("beschnitt") === "1") document.documentElement.classList.add("bleed");</script>
</body>
</html>
